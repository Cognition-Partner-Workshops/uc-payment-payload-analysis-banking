spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online-banking-rest-api}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

application.title = online-banking-rest-api
application.version = 1.0.0

server.port = 8080

logging.level.org.springframework = info

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

onlinebankingrestapi.jwt.security.app.key=${JWT_SIGNING_KEY}
onlinebankingrestapi.jwt.security.expire.time=86400000

cbarkinozer.kafka.adddress=${KAFKA_ADDRESS:localhost:9092}
cbarkinozer.kafka.topic=${KAFKA_TOPIC:logs}
cbarkinozer.kafka.group-id=${KAFKA_GROUP_ID:onlinebankingrestapi}

spring.main.banner-mode=off
spring.http.converters.preferred-json-mapper=jackson2
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true