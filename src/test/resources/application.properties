application.title=online-banking-rest-api
spring.http.converters.preferred-json-mapper=jackson2
application.version=1.0.0
spring.datasource.url=jdbc:h2:mem:banking;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.listener.auto-startup=false
cbarkinozer.kafka.adddress=localhost:9092
cbarkinozer.kafka.topic=logs
cbarkinozer.kafka.group-id=tests
# Tests sign tokens with a key generated per test run unless JWT_SIGNING_KEY is provided (two random values keep it >= 64 bytes).
onlinebankingrestapi.jwt.security.app.key=${JWT_SIGNING_KEY:${random.value}${random.value}}
onlinebankingrestapi.jwt.security.expire.time=86400000
