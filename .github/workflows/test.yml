name: Payments suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  payments-suite:
    name: Payments suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile all sources and run payments and remediation suites
        run: ./mvnw -B '-Dtest=com.cbarkinozer.onlinebankingrestapi.app.pay.PaymentReplayTest,com.cbarkinozer.onlinebankingrestapi.app.pay.PaymentRendererTest,com.cbarkinozer.onlinebankingrestapi.app.pay.PaymentControllerTest,com.cbarkinozer.onlinebankingrestapi.DockerfileTest,com.cbarkinozer.onlinebankingrestapi.app.kafka.consumer.KafkaListenerServiceTest' test
